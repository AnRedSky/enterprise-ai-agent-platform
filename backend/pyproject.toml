[project]
name = "backend"
version = "0.1.0"
description = "Enterprise AI Agent Platform backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "bcrypt==4.0.1",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "passlib[bcrypt]==1.7.4",
    "pydantic-settings==2.7.1",
    "pydantic==2.10.4",
    "python-jose[cryptography]==3.3.0",
    "sqlalchemy==2.0.36",
    "tzdata==2025.2",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "aiosqlite==0.20.0",
    "pytest-asyncio==0.25.0",
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# SQLAlchemy asyncpg 连接池绑定创建它的事件循环；项目集成测试共享同一会话级事件循环，避免连接池跨函数事件循环复用。
asyncio_default_fixture_loop_scope = "session"
# pytest-asyncio 0.25.0 不支持独立的默认测试 loop scope 配置；测试级 loop 由 pytest-asyncio 版本能力与测试标记共同管理，避免产生未知配置警告。
# unit/integration 下允许存在同名测试文件；使用 importlib 模式避免 pytest 以顶层模块名导入造成 import file mismatch。
addopts = "-m 'not real_api' --import-mode=importlib"
markers = [
    "real_api: tests that make HTTP calls to a separately running backend service",
    "integration: tests that require external integration infrastructure such as PostgreSQL",
]
