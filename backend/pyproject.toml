[project]
name = "backend"
version = "0.1.0"
description = "Enterprise AI Agent Platform backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "bcrypt==4.0.1",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "passlib[bcrypt]==1.7.4",
    "pydantic-settings==2.7.1",
    "pydantic==2.10.4",
    "python-jose[cryptography]==3.3.0",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "aiosqlite==0.20.0",
    "pytest-asyncio==0.25.0",
    "pytest==8.3.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
