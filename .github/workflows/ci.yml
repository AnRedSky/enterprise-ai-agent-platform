name: CI

# TEMPORARILY PAUSED: automatic CI execution is disabled during Phase 1.x stabilization.
# Keep the workflow definition for later repair; re-enable push/pull_request after CI is fixed.
on:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: pytest -q
