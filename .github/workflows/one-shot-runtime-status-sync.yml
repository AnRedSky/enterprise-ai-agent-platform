name: one-shot-runtime-status-sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-status-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Update status and strengthen unit contract
        shell: python
        run: |
          from pathlib import Path

          status = Path('docs/PROJECT_STATUS.md')
          lines = status.read_text(encoding='utf-8').splitlines()
          anchor = next((i for i, line in enumerate(lines) if 'Recovery Commit Ownership Boundary' in line), None)
          if anchor is None:
              raise SystemExit('PROJECT_STATUS recovery ownership anchor not found')
          entry = '- Runtime Durable Commit Ownership：**已完成；Runtime NodeExecution / Checkpoint transition 使用 `commit=False`，由外层 Execution `completed/failed` transition 统一提交；直接调用方默认保持 `commit=True` 兼容。**'
          if not any('Runtime Durable Commit Ownership' in line for line in lines):
              lines.insert(anchor + 1, entry)
          status.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          test = Path('backend/tests/unit/test_workflow_runtime_transaction_boundary.py')
          test.write_text('''from __future__ import annotations\n\nimport inspect\nfrom pathlib import Path\n\nfrom app.services.workflow.execution import WorkflowExecutionService\n\n\ndef test_transition_node_exposes_explicit_commit_ownership() -> None:\n    parameter = inspect.signature(WorkflowExecutionService.transition_node).parameters["commit"]\n    assert parameter.default is True\n    assert parameter.kind is inspect.Parameter.KEYWORD_ONLY\n\n\ndef test_runtime_node_transitions_are_caller_owned() -> None:\n    source = Path("app/runtime/workflow/runtime.py").read_text(encoding="utf-8")\n    assert 'target_status="completed"' not in source\n    assert 'output_data=output, commit=False' in source\n    assert 'input_data=current_data, commit=False' in source\n''', encoding='utf-8')

          workflow = Path('.github/workflows/one-shot-runtime-status-sync.yml')
          workflow.unlink()
      - name: Commit status sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT_STATUS.md backend/tests/unit/test_workflow_runtime_transaction_boundary.py .github/workflows/one-shot-runtime-status-sync.yml
          git diff --cached --check
          git commit -m "docs(workflow): record runtime durable commit ownership [runtime-status-sync]"
          git push
